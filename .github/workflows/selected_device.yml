# This is a basic workflow to help you get started with Actions

name: Build UEFI for selected Device

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths:
      - 'Platforms/*/Device/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      device:
        description: Device to build
        required: true
        type: choice
        options:
          - asus-I001DC
          - ayaneo-aps
          - ayn-odin2
          - eebbk-h130
          - lg-alpha
          - lg-beta
          - lg-flash
          - lg-mh2lm
          - lg-mh2lm5g
          - motorola-nio
          - nubia-nx729j
          - nubia-tp1803
          - oneplus-dumpling
          - oneplus-guacamole
          - oneplus-guacamoleb
          - oneplus-hotdog
          - oneplus-hotdogb
          - oneplus-hotdogg
          - oneplus-plk110
          - oneplus-salami
          - oppo-pclm10
          - qcom-hdk8150
          - qcom-hdk8450
          - qcom-hhg8350
          - qcom-mtp50
          - qcom-mtp670
          - qcom-mtp8150
          - qcom-mtp8250
          - qcom-mtp8350
          - qcom-mtp8450
          - qcom-mtp8550
          - qcom-mtp8996
          - qcom-qrd7125
          - qcom-qrd7150
          - qcom-qrd7325
          - qcom-qrd8150
          - qcom-qrd8250
          - qcom-qrd8350
          - qcom-qrd845
          - qcom-qrd8550
          - realme-rmx2086
          - samsung-a52sxq
          - samsung-beyond1qlte
          - samsung-gts6lwifi
          - samsung-gts7fewifi
          - samsung-q2q
          - samsung-winner
          - tb311fu
          - xiaomi-andromeda
          - xiaomi-cepheus
          - xiaomi-haydn
          - xiaomi-miatoll
          - xiaomi-nabu
          - xiaomi-raphael
          - xiaomi-sheng
          - xiaomi-socrates
          - xiaomi-surya
          - xiaomi-umi
          - xiaomi-vayu
          - xiaomi-venus

permissions:
  contents: read

jobs:
  build:
    name: Build UEFI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git nasm gcc-aarch64-linux-gnu python3 python3-distutils

      - name: Set Device Name
        id: set-device
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DEVICE=${{ github.event.inputs.device }}" >> $GITHUB_ENV
          else
            echo "DEVICE=tb311fu" >> $GITHUB_ENV
          fi

      - name: Build UEFI Image
        run: |
          echo "Compilando UEFI para o dispositivo: $DEVICE"
          # Altere a linha abaixo se o seu script de build for diferente (ex: ./build.sh -d $DEVICE)
          bash ./build.sh --device $DEVICE
          
      - name: Upload Build Artifacts
        uses: actions/artifacts@v4
        with:
          name: uefi-build-${{ env.DEVICE }}
          path: workspace/Build/**/*.fd
